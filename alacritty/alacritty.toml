[general]
import = ["~/.alacritty.local.toml"]

[font]
size = 14
normal = { family = "JetBrainsMono Nerd Font" }

[keyboard]
bindings = [
  { key = "n", mods = "Control | Shift", action = "SpawnNewInstance" },
]

[window]
padding = { x = 4, y = 8 }
decorations = "Full"
title = "Love"
decorations_theme_variant = "Dark"
